<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Executive Wellness Housing | Corporate Housing in La Porte, IN | The Old Ruth</title>
    <meta name="description" content="Private executive housing in La Porte, Indiana — 16 furnished suites in a 30,000 sq ft historic estate with integrated wellness, organic dining, and strategy spaces. One corporate contract. Everything handled." />
    <link rel="canonical" href="https://executivewellnesshousing.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#1C1C1E" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Social sharing card. The image is a JPEG on purpose — LinkedIn's crawler
         does not reliably read WebP and drops the picture when it cannot. These
         tags must match DEFAULT_OG_IMAGE in client/src/lib/seo.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Old Ruth — Executive Wellness Housing" />
    <meta property="og:title" content="Executive Wellness Housing | Corporate Housing in La Porte, IN" />
    <meta property="og:description" content="Private executive housing in La Porte, Indiana — 16 furnished suites in a 30,000 sq ft historic estate with integrated wellness, organic dining, and strategy spaces." />
    <meta property="og:url" content="https://executivewellnesshousing.com/" />
    <meta property="og:image" content="https://executivewellnesshousing.com/photos/og-the-old-ruth-exterior-2026-08.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Old Ruth — a circa-1888 brick mansion in La Porte, Indiana, seen across its lawn through mature trees" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Executive Wellness Housing | Corporate Housing in La Porte, IN" />
    <meta name="twitter:description" content="Private executive housing in La Porte, Indiana — 16 furnished suites in a 30,000 sq ft historic estate with integrated wellness, organic dining, and strategy spaces." />
    <meta name="twitter:image" content="https://executivewellnesshousing.com/photos/og-the-old-ruth-exterior-2026-08.jpg" />
    <meta name="twitter:image:alt" content="The Old Ruth — a circa-1888 brick mansion in La Porte, Indiana, seen across its lawn through mature trees" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet" />

    <!-- Analytics: configured in client/src/lib/analytics.ts — paste the GA4
         Measurement ID there. Nothing loads until an ID is set, and tracking is
         restricted to the production hostname so previews stay out of the data. -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Static declaration so Netlify registers the form at deploy time.
         The live form lives at /apply and posts to this name. -->
    <form name="residency-inquiry" netlify netlify-honeypot="company-website" hidden>
      <input type="text" name="First Name" />
      <input type="text" name="Last Name" />
      <input type="email" name="email" />
      <input type="tel" name="Phone" />
      <textarea name="Reason for Inquiry"></textarea>
      <select name="Length of Stay"></select>
      <textarea name="Contribution to the Peace"></textarea>
      <textarea name="Services of Interest"></textarea>
      <input type="checkbox" name="Covenant Acknowledged" />
      <input type="text" name="Landing Page" />
      <input type="text" name="Traffic Source" />
      <input type="text" name="Campaign" />
      <input name="company-website" />
    </form>
  </body>

</html>
